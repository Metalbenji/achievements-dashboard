<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achievement Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --dark-bg: #0f0f14;
            --card-bg: rgba(26, 26, 31, 0.95);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --achievement-gold: #ffd700;
            --neon-blue: #00d4ff;
            
            /* Container max-widths for different screen sizes */
            --max-width-mobile: 100%;
            --max-width-tablet: 768px;
            --max-width-desktop: 1200px;
            --max-width-large: 1400px;
            --max-width-ultrawide: 1800px;
            --max-width-superwide: 2400px;
            
            /* Grid settings */
            --grid-gap: clamp(15px, 2vw, 25px);
            --card-min-width: 280px;
            --card-max-width: 400px;
            
            /* Rarity colors */
            --rarity-1-main-color: #ffffff;
            --rarity-2-main-color: #00ff00;
            --rarity-3-main-color: #0080ff;
            --rarity-4-main-color: #8000ff;
            --rarity-5-main-color: #ff8000;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 80%, rgba(102, 126, 234, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(118, 75, 162, 0.1) 0%, transparent 50%);
            z-index: -1;
        }

        /* Container System for Better Responsive Control */
        .container {
            width: 100%;
            max-width: var(--max-width-mobile);
            margin: 0 auto;
            padding: 0 clamp(1rem, 3vw, 2rem);
        }

        /* Navigation */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(15, 15, 20, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: clamp(0.75rem, 2vw, 1rem) 0;
            z-index: 1000;
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: var(--max-width-superwide);
            margin: 0 auto;
            padding: 0 clamp(1rem, 3vw, 2rem);
        }

        .logo {
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        .logo .icon {
            margin-right: 0.5rem;
        }

        .navbar-social-icons {
            display: flex;
            align-items: center;
            gap: clamp(0.5rem, 1.5vw, 0.75rem);
        }

        .social-icon-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: clamp(32px, 4vw, 36px);
            height: clamp(32px, 4vw, 36px);
            border-radius: 8px;
            color: var(--text-secondary);
            background-color: transparent;
            border: 1px solid transparent;
            text-decoration: none;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            transition: all 0.3s ease;
        }

        .social-icon-button:hover {
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        /* Social icon hover states */
        .social-icon-button.twitch:hover { background-color: #9146ff; color: white; border-color: #9146ff; }
        .social-icon-button.kick:hover { background-color: #53fc18; color: black; border-color: #53fc18; }
        .social-icon-button.youtube:hover { background-color: #ff0000; color: white; border-color: #ff0000; }
        .social-icon-button.tiktok:hover { background-color: #010101; color: white; border-color: #010101; }
        .social-icon-button.x-twitter:hover { background-color: #000000; color: white; border-color: #000000; }
        .social-icon-button.kofi:hover { background-color: #FF5E5B; color: white; border-color: #FF5E5B; }

        /* Main Content */
        .main-content {
            margin-top: clamp(70px, 10vw, 90px);
            padding: clamp(1rem, 3vw, 2rem) 0;
            max-width: var(--max-width-superwide);
            margin-left: auto;
            margin-right: auto;
            flex: 1;
            width: 100%;
            padding-left: clamp(1rem, 3vw, 2rem);
            padding-right: clamp(1rem, 3vw, 2rem);
        }

        .header {
            text-align: center;
            margin-bottom: clamp(20px, 4vw, 30px);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: clamp(1.5rem, 4vw, 2rem);
            position: relative;
            overflow: hidden;
            max-width: 100%;
        }

        .header h1 {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            position: relative;
            z-index: 1;
        }

        .header p {
            color: var(--text-secondary);
            font-size: clamp(1rem, 2.5vw, 1.1rem);
            position: relative;
            z-index: 1;
            max-width: 60ch;
            margin: 0 auto;
        }

        .user-input {
            display: flex;
            gap: clamp(10px, 2vw, 15px);
            justify-content: center;
            margin-bottom: clamp(15px, 3vw, 20px);
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .user-input input {
            padding: clamp(12px, 2.5vw, 15px) clamp(20px, 4vw, 25px);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: clamp(14px, 2.5vw, 16px);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            background: var(--glass-bg);
            color: var(--text-primary);
            min-width: clamp(200px, 40vw, 250px);
            max-width: 100%;
            transition: all 0.3s ease;
            flex: 1;
        }

        .user-input input:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: clamp(0.6rem, 2vw, 0.75rem) clamp(1.2rem, 3vw, 1.5rem);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            justify-content: center;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        /* Enhanced Grid System for Different Screen Sizes */
        .progress-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(clamp(150px, 25vw, 200px), 1fr));
            gap: var(--grid-gap);
            margin-bottom: clamp(20px, 4vw, 30px);
            max-width: 100%;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: clamp(1rem, 3vw, 1.5rem);
            text-align: center;
            transition: all 0.3s ease;
            min-width: 0; /* Prevent overflow */
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: rgba(102, 126, 234, 0.5);
        }

        .stat-card h3 {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        .stat-card .number {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Responsive Filter Tabs */
        .filter-tabs {
            display: flex;
            justify-content: center;
            gap: clamp(8px, 2vw, 15px);
            margin-bottom: clamp(20px, 4vw, 30px);
            flex-wrap: wrap;
            max-width: 100%;
        }

        .filter-tab {
            padding: clamp(8px, 2vw, 12px) clamp(15px, 3vw, 25px);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            background: var(--glass-bg);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: clamp(0.8rem, 1.8vw, 0.9rem);
            white-space: nowrap;
            text-align: center;
        }

        .filter-tab:hover {
            border-color: rgba(102, 126, 234, 0.5);
            transform: translateY(-2px);
        }

        .filter-tab.active {
            background: var(--primary-gradient);
            border-color: transparent;
            color: white;
        }

        /* Enhanced Achievement Grid System */
        .achievements-grid {
            display: grid;
            gap: var(--grid-gap);
            width: 100%;
            /* Mobile-first: single column */
            grid-template-columns: 1fr;
        }

        .achievement-card {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            border-width: 3px;
            border-style: solid;
            border-color: var(--neon-blue);
            border-radius: 20px;
            padding: clamp(20px, 4vw, 25px);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5), inset 0 0 20px rgba(0, 212, 255, 0.1);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            min-width: 0; /* Prevent overflow */
            max-width: var(--card-max-width);
            width: 100%;
        }

        .achievement-card.locked {
            opacity: 0.6;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2), inset 0 0 10px rgba(0, 212, 255, 0.05);
        }

        /* Rarity-specific colors */
        .achievement-card.rarity-color-1 { border-color: var(--rarity-1-main-color); }
        .achievement-card.rarity-color-2 { border-color: var(--rarity-2-main-color); }
        .achievement-card.rarity-color-3 { border-color: var(--rarity-3-main-color); }
        .achievement-card.rarity-color-4 { border-color: var(--rarity-4-main-color); }
        .achievement-card.rarity-color-5 { border-color: var(--rarity-5-main-color); }

        .achievement-card:hover {
            transform: translateY(-5px);
        }

        .achievement-header {
            display: flex;
            align-items: flex-start;
            gap: clamp(12px, 2.5vw, 15px);
            margin-bottom: clamp(15px, 3vw, 20px);
            position: relative;
            z-index: 1;
        }

        .achievement-icon {
            font-size: clamp(3rem, 6vw, 4rem);
            flex-shrink: 0;
            filter: grayscale(100%);
            transition: all 0.3s ease;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            font-family: 'Orbitron', monospace;
        }

        .achievement-card.unlocked .achievement-icon {
            filter: none;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            animation: bounce 1s ease-in-out infinite alternate;
        }

        .achievement-info {
            flex-grow: 1;
            min-width: 0;
        }

        .achievement-info h3 {
            font-size: clamp(1.1rem, 2.8vw, 1.4rem);
            margin-bottom: 8px;
            color: var(--neon-blue);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: clamp(0.5px, 0.8vw, 1.5px);
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.8);
            font-family: 'Orbitron', monospace;
            overflow-wrap: break-word;
            word-wrap: break-word;
            hyphens: auto;
            line-height: 1.1;
            /* Smart text handling */
            display: -webkit-box;
            -webkit-line-clamp: 3; /* Allow up to 3 lines */
            -webkit-box-orient: vertical;
            overflow: hidden;
            /* Better spacing for multi-line titles */
            max-height: calc(1.1em * 3 + 0.2em); /* 3 lines + small buffer */
            /* Keep consistent styling */
            word-spacing: 0.15em; /* Add slight spacing between words for readability */
        }
        
        /* Specific handling for very long words - keeps uppercase but optimizes spacing */
        .achievement-info h3.long-word {
            letter-spacing: clamp(0.2px, 0.4vw, 0.8px); /* Tighter spacing for long words */
            word-spacing: 0.1em;
            font-size: clamp(1rem, 2.4vw, 1.3rem); /* Slightly smaller but still prominent */
        }
        
        /* For titles with multiple long words */
        .achievement-info h3.multi-long-words {
            letter-spacing: clamp(0.3px, 0.6vw, 1px);
            word-spacing: 0.2em; /* More space between words */
            line-height: 1.05; /* Tighter line height for multi-line */
        }
        
        /* For extremely long single words that need strategic breaking */
        .achievement-info h3.break-long-word {
            letter-spacing: clamp(0.1px, 0.3vw, 0.6px);
            word-break: break-all; /* Only used as last resort */
            font-size: clamp(0.95rem, 2.2vw, 1.25rem);
        }

        .achievement-card.unlocked .achievement-info h3 {
            color: var(--achievement-gold);
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        }

        .achievement-info .rarity {
            font-size: clamp(0.8rem, 1.8vw, 0.9rem);
            padding: clamp(6px, 1.5vw, 8px) clamp(12px, 2.5vw, 16px);
            border-radius: 20px;
            display: inline-block;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px currentColor;
        }

        /* Rarity styles */
        .rarity-1 { background: rgba(255, 255, 255, 0.2); color: #ffffff; border: 2px solid #ffffff; }
        .rarity-2 { background: rgba(0, 255, 0, 0.2); color: #00ff00; border: 2px solid #00ff00; box-shadow: 0 0 15px rgba(0, 255, 0, 0.5); }
        .rarity-3 { background: rgba(0, 128, 255, 0.2); color: #0080ff; border: 2px solid #0080ff; box-shadow: 0 0 15px rgba(0, 128, 255, 0.5); }
        .rarity-4 { background: rgba(128, 0, 255, 0.2); color: #8000ff; border: 2px solid #8000ff; box-shadow: 0 0 15px rgba(128, 0, 255, 0.5); animation: glow-purple 1.5s ease-in-out infinite alternate; }
        .rarity-5 { background: rgba(255, 128, 0, 0.2); color: #ff8000; border: 2px solid #ff8000; box-shadow: 0 0 20px rgba(255, 128, 0, 0.8); animation: legendary-glow 1.5s ease-in-out infinite alternate; }

        .achievement-description {
            margin-bottom: clamp(15px, 3vw, 20px);
            line-height: 1.5;
            color: #ffffff;
            opacity: 0.9;
            position: relative;
            z-index: 1;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            overflow-wrap: break-word;
            word-wrap: break-word;
        }

        .progress-bar {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 15px;
            height: clamp(20px, 4vw, 25px);
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--neon-blue), #0080ff, var(--achievement-gold));
            height: 100%;
            transition: width 0.8s ease;
            border-radius: 15px;
            position: relative;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(0.8rem, 1.8vw, 1rem);
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
            color: #ffffff;
            z-index: 2;
            font-family: 'Orbitron', monospace;
        }

        .unlock-date {
            margin-top: clamp(12px, 2.5vw, 15px);
            font-size: clamp(0.8rem, 1.8vw, 0.9rem);
            color: var(--achievement-gold);
            font-style: italic;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
            position: relative;
            z-index: 1;
        }

        .achievement-group-title {
            font-size: clamp(1.4rem, 3.5vw, 1.8rem);
            font-weight: 700;
            color: var(--text-primary);
            margin-top: clamp(30px, 6vw, 40px);
            margin-bottom: clamp(15px, 3vw, 20px);
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
            text-align: left;
        }

        .achievement-group-title:first-child {
            margin-top: 0;
        }

        .error-message,
        .loading,
        .no-achievements-message {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: clamp(20px, 4vw, 30px);
            border-radius: 15px;
            margin: clamp(15px, 3vw, 20px) 0;
            text-align: center;
            font-weight: 600;
            font-size: clamp(1rem, 2.5vw, 1.2rem);
        }

        .error-message {
            border-color: var(--danger);
            color: #ffcccc;
        }

        /* Footer */
        .app-footer {
            background: rgba(15, 15, 20, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            padding: clamp(1rem, 3vw, 1.5rem);
            margin-top: auto;
            position: relative;
            z-index: 500;
        }

        .footer-content {
            max-width: var(--max-width-large);
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .footer-text {
            color: var(--text-secondary);
            font-size: clamp(0.8rem, 1.8vw, 0.9rem);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .footer-author {
            color: var(--text-primary);
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            font-size: clamp(0.9rem, 2vw, 1rem);
        }

        .footer-links {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: clamp(0.7rem, 1.6vw, 0.8rem);
            flex-wrap: wrap;
        }

        /* Responsive Breakpoints */
        
        /* Small tablets and large phones */
        @media (min-width: 480px) {
            :root {
                --max-width-mobile: var(--max-width-tablet);
            }
            
            .user-input {
                flex-direction: row;
            }
            
            .user-input input {
                flex: 0 1 auto;
                min-width: 250px;
            }
        }

        /* Tablets */
        @media (min-width: 768px) {
            :root {
                --max-width-mobile: var(--max-width-desktop);
            }
            
            .achievements-grid {
                grid-template-columns: repeat(auto-fit, minmax(var(--card-min-width), 1fr));
            }
            
            .navbar-social-icons {
                display: flex;
            }
            
            .progress-overview {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            }
        }

        /* Desktop */
        @media (min-width: 1024px) {
            :root {
                --max-width-mobile: var(--max-width-large);
            }
            
            .achievements-grid {
                grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            }
        }

        /* Large desktop */
        @media (min-width: 1400px) {
            :root {
                --max-width-mobile: var(--max-width-ultrawide);
            }
            
            .achievements-grid {
                grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
                max-width: 100%;
            }
        }

        /* Ultrawide screens */
        @media (min-width: 1800px) {
            :root {
                --max-width-mobile: var(--max-width-superwide);
                --grid-gap: 30px;
            }
            
            .achievements-grid {
                grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            }
            
            .main-content {
                padding-left: 3rem;
                padding-right: 3rem;
            }
        }

        /* Super ultrawide screens (32:9 aspect ratio and beyond) */
        @media (min-width: 2400px) {
            .achievements-grid {
                grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
                gap: 35px;
            }
            
            .main-content {
                padding-left: 4rem;
                padding-right: 4rem;
            }
        }

        /* Vertical screens and mobile landscape */
        @media (max-height: 600px) and (orientation: landscape) {
            .header {
                padding: 1rem;
                margin-bottom: 1rem;
            }
            
            .header h1 {
                font-size: 1.5rem;
                margin-bottom: 0.5rem;
            }
            
            .main-content {
                margin-top: 70px;
                padding-top: 1rem;
            }
        }

        /* High density screens */
        @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
            .achievement-icon,
            .logo {
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }
        }

        /* Animations */
        @keyframes bounce {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(5deg); }
        }

        @keyframes glow-purple {
            0% { box-shadow: 0 0 15px rgba(128, 0, 255, 0.5); }
            100% { box-shadow: 0 0 25px rgba(128, 0, 255, 0.8), 0 0 10px rgba(200, 160, 255, 0.4); }
        }

        @keyframes legendary-glow {
            0% { box-shadow: 0 0 20px rgba(255, 128, 0, 0.4); transform: scale(1); }
            100% { box-shadow: 0 0 30px rgba(255, 128, 0, 0.8), 0 0 40px rgba(255, 215, 0, 0.3); transform: scale(1.02); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .loading::after {
            content: "...";
            animation: pulse 1.5s infinite;
        }

        .footer-heart {
            color: #ff6b6b;
            animation: heartbeat 1.5s ease-in-out infinite;
            font-size: 0.9rem;
        }

        /* Add some additional responsive typography utilities */
        
        /* Better handling for mobile portrait mode */
        @media (max-width: 480px) and (orientation: portrait) {
            .achievement-info h3 {
                font-size: clamp(1rem, 4vw, 1.2rem);
                line-height: 1.05;
                -webkit-line-clamp: 2; /* Limit to 2 lines on small screens */
                max-height: calc(1.05em * 2 + 0.1em);
            }
            
            .achievement-card {
                padding: clamp(15px, 5vw, 20px);
            }
            
            .achievement-header {
                gap: clamp(10px, 3vw, 12px);
            }
            
            .achievement-icon {
                font-size: clamp(2.5rem, 8vw, 3.5rem);
            }
        }
        
        /* Better handling for landscape mobile and small tablets */
        @media (max-height: 600px) and (orientation: landscape) {
            .achievement-info h3 {
                font-size: clamp(0.9rem, 2.5vw, 1.1rem);
                line-height: 1;
                margin-bottom: 6px;
                -webkit-line-clamp: 2;
                max-height: calc(1em * 2 + 0.1em);
            }
        }
        
        /* Enhanced support for CSS that might not be available in all browsers */
        @supports not (text-wrap: balance) {
            .achievement-info h3 {
                /* Fallback for browsers without text-wrap support */
                word-spacing: 0.1em;
            }
        }
        
        @supports not (text-wrap: pretty) {
            .achievement-info h3 {
                /* Enhanced word breaking for older browsers */
                word-break: break-word;
                overflow-wrap: anywhere;
            }
        }

        /* Print styles */
        @media print {
            .navbar, .app-footer, .user-input, .filter-tabs {
                display: none;
            }
            
            .main-content {
                margin-top: 0;
            }
            
            .achievement-card {
                break-inside: avoid;
                page-break-inside: avoid;
            }
        }
    </style>
</head>

                    aria-label="Twitch">

                    <i class="fas fa-k"></i>
                </a>

                    aria-label="YouTube">
                    <i class="fab fa-youtube"></i>
                </a>

    <!-- Main Content -->
    <main class="main-content">

            <div class="user-input">
                <input type="text" id="usernameInput" placeholder="Enter your Twitch username" />
                <button class="btn btn-primary" id="loadUserDataBtn">

                    Load Progress
                </button>

    <!-- Footer -->
    <footer class="app-footer">
        <div class="footer-content">
            <span class="footer-text">
                Made with <i class="fas fa-heart footer-heart"></i> by
                <strong class="footer-author">MetalBenji</strong>
            </span>
            <div class="footer-links">
                <span class="footer-version">Achievement Dashboard v1.0</span>
                <span class="footer-separator">•</span>
                <span class="footer-tech" id="randomFooterMessage">Powered by JavaScript & CSS Magic</span>
            </div>
        </div>
    </footer>

    <script>
        // Global variables
        let currentFilter = 'all';
        let achievements = [];
        let userProgress = null;

        // DOM Element References
        let usernameInputElement;
        let contentElement;
        let randomFooterMessageElement;
        let loadUserDataButtonElement;

        // Random footer messages
        const footerMessages = [
            "Powered by a little energon, and a lot of luck",
            "Fueled by coffee and determination",
            "Powered by JavaScript & CSS Magic",
            "Built with love and late-night coding",
            "Powered by pure streaming magic",
            "Made with chaos and good intentions",
            "Fueled by hope and Red Bull",
            "Powered by the power of friendship",
            "Built on dreams and Stack Overflow",
            "Fueled by memes and determination",
            "Powered by 1s and 0s (mostly 0s)",
            "Made with bits, bytes, and vibes",
            "Fueled by subscriber energy",
            "Powered by follower notifications",
            "Built with stream love and code",
            "Fueled by chat encouragement"
        ];

        function setRandomFooterMessage() {
            if (randomFooterMessageElement) {
                const randomIndex = Math.floor(Math.random() * footerMessages.length);
                randomFooterMessageElement.textContent = footerMessages[randomIndex];
            }
        }

        // Load data from JSON file
        async function loadUserData() {
            try {
                if (!usernameInputElement) {
                    console.error("Username input element not found.");
                    return;
                }
                const username = usernameInputElement.value.trim();
                if (!username) {
                    showError("Please enter a username");
                    return;
                }

                showLoading();

                const response = await fetch('/.netlify/functions/get-user-data', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || `An error occurred. Status: ${response.status}`);
                }

                achievements = data.achievements;
                userProgress = data.userProgress;

                if (userProgress) {
                    displayDashboard();
                } else {
                    showError(`No achievement data found for user "${username}".`);
                }
            } catch (error) {
                console.error('Failed to load user data:', error);
                showError(error.message);
            }
        }

        function showLoading() {
            if (contentElement) contentElement.innerHTML = '<div class="loading">Loading achievements</div>';
        }

        function showError(message) {
            if (contentElement) contentElement.innerHTML = `<div class="error-message">${message}</div>`;
        }

        function displayDashboard() {
            const unlockedCount = userProgress.UnlockedAchievements.length;
            const totalCount = achievements.length;
            const completionRate = ((unlockedCount / totalCount) * 100).toFixed(1);

            const content = `
                <div class="progress-overview">
                    <div class="stat-card">
                        <h3>🏆 Achievements</h3>
                        <div class="number">${unlockedCount}/${totalCount}</div>
                    </div>
                    <div class="stat-card">
                        <h3>📈 Completion</h3>
                        <div class="number">${completionRate}%</div>
                    </div>
                </div>

                <div class="filter-tabs">
                    <button class="filter-tab ${currentFilter === 'all' ? 'active' : ''}" data-filter="all">All</button>
                    <button class="filter-tab ${currentFilter === 'unlocked' ? 'active' : ''}" data-filter="unlocked">Unlocked</button>
                    <button class="filter-tab ${currentFilter === 'locked' ? 'active' : ''}" data-filter="locked">Locked</button>
                    <button class="filter-tab ${currentFilter === 'chat' ? 'active' : ''}" data-filter="chat">Chat</button>
                    <button class="filter-tab ${currentFilter === 'sub' ? 'active' : ''}" data-filter="sub">Subscription</button>
                    <button class="filter-tab ${currentFilter === 'bits' ? 'active' : ''}" data-filter="bits">Bits</button>
                    <button class="filter-tab ${currentFilter === 'screenshot' ? 'active' : ''}" data-filter="screenshot">Screenshot</button>
                    <button class="filter-tab ${currentFilter === 'timewatched' ? 'active' : ''}" data-filter="timewatched">Time Watched</button>
                    <button class="filter-tab ${currentFilter === 'effect' ? 'active' : ''}" data-filter="effect">Effect</button>
                    <button class="filter-tab ${currentFilter === 'sound' ? 'active' : ''}" data-filter="sound">Sound</button>
                    <button class="filter-tab ${currentFilter === 'channelpoints' ? 'active' : ''}" data-filter="channelpoints">Channel Points</button>
                    <button class="filter-tab ${currentFilter === 'giftsub' ? 'active' : ''}" data-filter="giftsub">Gift Sub</button>
                    <button class="filter-tab ${currentFilter === 'donations' ? 'active' : ''}" data-filter="donations">Donations</button>
                    <button class="filter-tab ${currentFilter === 'bigdonation' ? 'active' : ''}" data-filter="bigdonation">Big Donations</button>
                    <button class="filter-tab ${currentFilter === 'giftbomb' ? 'active' : ''}" data-filter="giftbomb">Gift Bomb</button>
                    <button class="filter-tab ${currentFilter === 'clips' ? 'active' : ''}" data-filter="clips">Clips</button>
                </div>

                <div id="achievementsContainer">
                    ${renderAchievements()}
                </div>
            `;
            if (contentElement) {
                contentElement.innerHTML = content;

                contentElement.querySelectorAll('.filter-tab').forEach(button => {
                    button.addEventListener('click', function () {
                        setFilter(this.dataset.filter);
                    });
                });
                adjustSingleWordTitles();
            }
        }

        function getAchievementCategory(achievement) {
            const achievementName = achievement.Name.toLowerCase();
            const achievementDescription = achievement.Description ? achievement.Description.toLowerCase() : '';

            if (achievementName.includes('night owl') ||
                achievementName.includes('early bird') ||
                achievementName.includes('weekend warrior')) {
                return 'timewatched';
            }

            if (achievementName.includes('transformation rookie') ||
                achievementName.includes('effect collector') ||
                achievementName.includes('transformation master') ||
                (achievementName.includes('shape') && achievementName.includes('shifting') && achievementName.includes('legend')) ||
                (achievementName.includes('shapeshifting') && achievementName.includes('legend'))) {
                return 'effect';
            }

            if (achievementName.includes('sound pioneer') ||
                achievementName.includes('chat dj') ||
                achievementName.includes('sound mixer')) {
                return 'sound';
            }

            if (achievementName.includes('point spender') ||
                achievementName.includes('big spender') ||
                achievementName.includes('whale spender') ||
                achievementName.includes('point millionaire')) {
                return 'channelpoints';
            }

            if (achievementDescription.includes('bomb')) {
                return 'giftbomb';
            }

            if (achievementName.includes('first gift') ||
                achievementName.includes('kind soul') ||
                achievementName.includes('caring friend') ||
                achievementName.includes('thoughtful gifter') ||
                achievementName.includes('community supporter') ||
                achievementName.includes('gift champion') ||
                achievementName.includes('community hero') ||
                achievementName.includes('gift angel') ||
                achievementName.includes('community patron') ||
                achievementName.includes('stream guardian') ||
                achievementName.includes('gift baron') ||
                achievementName.includes('gift lord') ||
                achievementName.includes('gift emperor') ||
                achievementName.includes('gift deity') ||
                achievementName.includes('gift transcendent') ||
                achievementName.includes('gift omnipotent')) {
                return 'giftsub';
            }

            if (achievementName.includes('big heart') ||
                achievementName.includes('regular big donor') ||
                achievementName.includes('big donation champion') ||
                achievementName.includes('big donation legend') ||
                achievementName.includes('big donation master')) {
                return 'bigdonation';
            }

            if (achievementName.includes('getting started') ||
                achievementName.includes('generous spirit') ||
                achievementName.includes('kind contributor') ||
                achievementName.includes('donation champion') ||
                achievementName.includes('donation legend') ||
                achievementName.includes('stream patron') ||
                achievementName.includes('donation master') ||
                achievementName.includes('donation deity') ||
                achievementName.includes('transcendent supporter') ||
                achievementName.includes('trancendent supporter')) {
                return 'donations';
            }

            if (achievement.Type.toLowerCase() === 'clips' || achievementName.includes('clip')) {
                return 'clips';
            }

            return achievement.Type.toLowerCase().replace(/\s+/g, '').replace('-', '').replace('_', '');
        }

        function isDonationCountAchievement(achievement) {
            const countBasedIds = [
                'donation_first_timer',
                'donation_kind',
                'donation_caring',
                'donation_frequent',
                'donation_dedicated',
                'donation_champion',
                'donation_hero',
                'donation_legend',
                'donation_master',
                'donation_god'
            ];

            return countBasedIds.includes(achievement.Id);
        }

        function convertUSDtoGBP(usdAmount) {
            const conversionRate = 0.8;
            return Math.round(usdAmount * conversionRate * 100) / 100;
        }

        function formatCurrencyValue(value, isDonationAmount) {
            if (isDonationAmount) {
                const gbpValue = convertUSDtoGBP(value);
                return `£${gbpValue.toFixed(2)}`;
            }
            return value.toString();
        }

        function convertDescriptionCurrency(description, isDonationAmount) {
            if (!isDonationAmount) return description;

            return description.replace(/\$(\d+(?:\.\d{2})?)/g, (match, amount) => {
                const usdAmount = parseFloat(amount);
                const gbpValue = convertUSDtoGBP(usdAmount);
                return `£${gbpValue.toFixed(2)}`;
            });
        }

        function mapAchievementToHtml(achievement) {
            const isUnlocked = userProgress.UnlockedAchievements.includes(achievement.Id);
            const typeKey = getAchievementCategory(achievement);

            let counterKey = typeKey;
            if (typeKey === 'timewatched') counterKey = 'timewatched';
            else if (typeKey === 'channelpoints') counterKey = 'channelpoints';
            else if (typeKey === 'giftsub') counterKey = 'giftsub';
            else if (typeKey === 'giftbomb') counterKey = 'giftbomb';
            else if (typeKey === 'bigdonation') counterKey = 'big_donation';
            else if (typeKey === 'donations') {
                counterKey = isDonationCountAchievement(achievement) ? 'donations' : 'total_donated';
            }

            const currentValue = userProgress.Counters[counterKey] || 0;
            const requiredValue = achievement.RequiredValue;

            let adjustedCurrentValue = currentValue;
            let adjustedRequiredValue = requiredValue;

            if (counterKey === 'total_donated') {
                adjustedCurrentValue = currentValue / 100;
                adjustedRequiredValue = requiredValue * 0.8;
            }

            let progress;
            let displayedCurrentValue;

            if (isUnlocked) {
                progress = 100;
                displayedCurrentValue = adjustedRequiredValue;
            } else {
                progress = Math.min((adjustedCurrentValue / adjustedRequiredValue) * 100, 100);
                displayedCurrentValue = Math.min(adjustedCurrentValue, adjustedRequiredValue);
            }

            const isDonationAmount = typeKey === 'donations' && !isDonationCountAchievement(achievement);

            const currentDisplayValue = isDonationAmount ? `£${displayedCurrentValue.toFixed(2)}` : displayedCurrentValue.toString();
            const requiredDisplayValue = isDonationAmount ? `£${adjustedRequiredValue.toFixed(2)}` : adjustedRequiredValue.toString();

            const convertedDescription = convertDescriptionCurrency(achievement.Description, isDonationAmount);

            return `
                <div class="achievement-card ${isUnlocked ? 'unlocked' : 'locked'} rarity-color-${achievement.Rarity}">
                    <div class="achievement-header">
                        <div class="achievement-icon">${achievement.Icon}</div>
                        <div class="achievement-info">
                            <h3>${achievement.Name}</h3>
                            <span class="rarity rarity-${achievement.Rarity}">★ Rarity ${achievement.Rarity}</span>
                        </div>
                    </div>
                    <div class="achievement-description">${convertedDescription}</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                        <div class="progress-text">${currentDisplayValue}/${requiredDisplayValue}</div>
                    </div>
                    ${isUnlocked ? '<div class="unlock-date">✅ Unlocked!</div>' : ''}
                </div>
            `;
        }

        function renderAchievements() {
            let html = '';
            const definedAchievementTypes = ['chat', 'sub', 'bits', 'screenshot', 'timewatched', 'effect', 'sound', 'channelpoints', 'giftsub', 'donations', 'bigdonation', 'giftbomb', 'clips'];

            if (currentFilter === 'all') {
                const groupedByType = {};
                const miscellaneousAchievements = [];

                achievements.forEach(ach => {
                    const typeKey = getAchievementCategory(ach);
                    if (definedAchievementTypes.includes(typeKey)) {
                        if (!groupedByType[typeKey]) {
                            groupedByType[typeKey] = [];
                        }
                        groupedByType[typeKey].push(ach);
                    } else {
                        miscellaneousAchievements.push(ach);
                    }
                });

                const groupDisplayOrder = [
                    { key: 'chat', name: 'Chat' },
                    { key: 'sub', name: 'Subscription' },
                    { key: 'bits', name: 'Bits' },
                    { key: 'screenshot', name: 'Screenshot' },
                    { key: 'timewatched', name: 'Time Watched' },
                    { key: 'effect', name: 'Effect' },
                    { key: 'sound', name: 'Sound' },
                    { key: 'channelpoints', name: 'Channel Points' },
                    { key: 'giftsub', name: 'Gift Sub' },
                    { key: 'donations', name: 'Donations' },
                    { key: 'bigdonation', name: 'Big Donations' },
                    { key: 'giftbomb', name: 'Gift Bomb' },
                    { key: 'clips', name: 'Clips' }
                ];

                groupDisplayOrder.forEach(group => {
                    if (groupedByType[group.key] && groupedByType[group.key].length > 0) {
                        html += `<h2 class="achievement-group-title">${group.name} Achievements</h2>`;
                        html += '<div class="achievements-grid">';
                        html += groupedByType[group.key].map(ach => mapAchievementToHtml(ach)).join('');
                        html += '</div>';
                    }
                });

                if (miscellaneousAchievements.length > 0) {
                    html += `<h2 class="achievement-group-title">Other Achievements</h2>`;
                    html += '<div class="achievements-grid">';
                    html += miscellaneousAchievements.map(ach => mapAchievementToHtml(ach)).join('');
                    html += '</div>';
                }

                if (html === '' && achievements.length > 0) {
                    html = '<p class="no-achievements-message">No achievements to display in defined categories.</p>';
                } else if (html === '' && achievements.length === 0) {
                    html = '<p class="no-achievements-message">No achievements are currently available.</p>';
                }

            } else {
                const filteredAchievements = achievements.filter(achievement => {
                    if (currentFilter === 'unlocked') return userProgress.UnlockedAchievements.includes(achievement.Id);
                    if (currentFilter === 'locked') return !userProgress.UnlockedAchievements.includes(achievement.Id);
                    const typeKey = getAchievementCategory(achievement);
                    return typeKey === currentFilter;
                });

                if (filteredAchievements.length > 0) {
                    if (definedAchievementTypes.includes(currentFilter)) {
                        const groupDisplayOrder = [
                            { key: 'chat', name: 'Chat' },
                            { key: 'sub', name: 'Subscription' },
                            { key: 'bits', name: 'Bits' },
                            { key: 'screenshot', name: 'Screenshot' },
                            { key: 'timewatched', name: 'Time Watched' },
                            { key: 'effect', name: 'Effect' },
                            { key: 'sound', name: 'Sound' },
                            { key: 'channelpoints', name: 'Channel Points' },
                            { key: 'giftsub', name: 'Gift Sub' },
                            { key: 'donations', name: 'Donations' },
                            { key: 'bigdonation', name: 'Big Donations' },
                            { key: 'giftbomb', name: 'Gift Bomb' },
                            { key: 'clips', name: 'Clips' }
                        ];
                        const groupInfo = groupDisplayOrder.find(g => g.key === currentFilter);
                        const groupName = groupInfo ? groupInfo.name : currentFilter.charAt(0).toUpperCase() + currentFilter.slice(1);
                        html += `<h2 class="achievement-group-title">${groupName} Achievements</h2>`;
                    }
                    html += '<div class="achievements-grid">';
                    html += filteredAchievements.map(ach => mapAchievementToHtml(ach)).join('');
                    html += '</div>';
                } else {
                    html = '<p class="no-achievements-message">No achievements match this filter.</p>';
                }
            }
            return html;
        }

        function adjustSingleWordTitles() {
            setTimeout(() => {
                const titleElements = contentElement ? contentElement.querySelectorAll('.achievement-info h3') : [];

                titleElements.forEach(h3 => {
                    // Reset any previous classes and inline styles
                    h3.classList.remove('long-word', 'multi-long-words', 'break-long-word');
                    h3.style.fontSize = '';
                    h3.style.letterSpacing = '';
                    h3.style.wordSpacing = '';
                    h3.innerHTML = h3.textContent; // Reset any HTML modifications

                    const text = h3.textContent.trim();
                    const words = text.split(/\s+/);
                    const longestWord = words.reduce((a, b) => a.length > b.length ? a : b, '');
                    const totalLength = text.replace(/\s/g, '').length;
                    
                    // Strategy 1: Analyze the content type
                    if (words.length === 1) {
                        // Single word handling
                        if (text.length > 18) {
                            // Very long single word - try strategic breaking with invisible characters
                            h3.classList.add('break-long-word');
                            
                            // Add zero-width spaces at natural break points for compound words
                            let breakableText = text;
                            
                            // Common compound word patterns (keeping original case)
                            breakableText = breakableText.replace(/([a-z])([A-Z])/g, '$1​$2'); // Zero-width space
                            breakableText = breakableText.replace(/(TRANS)(FORMATION)/gi, '$1​$2');
                            breakableText = breakableText.replace(/(TRANS)(CENDENT)/gi, '$1​$2');
                            breakableText = breakableText.replace(/(CONVERSATION)(ALIST)/gi, '$1​$2');
                            breakableText = breakableText.replace(/(SHAPE)(SHIFTING)/gi, '$1​$2');
                            breakableText = breakableText.replace(/(EXTRA)(ORDINARY)/gi, '$1​$2');
                            
                            // For technical terms or repeated patterns
                            breakableText = breakableText.replace(/(.{8})(.{4,})/g, '$1​$2'); // Every 8 chars if word is long enough
                            
                            if (breakableText !== text) {
                                h3.innerHTML = breakableText;
                            }
                        } else if (text.length > 12) {
                            // Moderately long single word
                            h3.classList.add('long-word');
                        }
                    } else if (words.length <= 4 && longestWord.length > 10) {
                        // Short phrase with long words
                        h3.classList.add('multi-long-words');
                    } else if (totalLength > 40) {
                        // Many words, long total length
                        h3.classList.add('multi-long-words');
                    }
                    
                    // Strategy 2: Container-based adjustment
                    // Give browser a moment to render the changes
                    setTimeout(() => {
                        const containerWidth = h3.clientWidth;
                        const scrollWidth = h3.scrollWidth;
                        
                        if (scrollWidth > containerWidth * 1.15) { // 15% tolerance
                            // Still overflowing after class application
                            
                            if (words.length === 1 && !h3.classList.contains('break-long-word')) {
                                // Single word that needs more aggressive breaking
                                h3.classList.add('break-long-word');
                                
                                // More aggressive zero-width space insertion
                                let aggressiveBreak = text;
                                // Insert break opportunities every 6-8 characters for very long words
                                if (text.length > 15) {
                                    aggressiveBreak = text.replace(/(.{6,8})/g, '$1​');
                                }
                                h3.innerHTML = aggressiveBreak;
                            } else {
                                // Multi-word overflow - adjust spacing
                                h3.style.letterSpacing = 'clamp(0.1px, 0.2vw, 0.4px)';
                                h3.style.wordSpacing = '0.05em';
                                h3.style.fontSize = 'clamp(0.9rem, 2.1vw, 1.2rem)';
                            }
                        }
                        
                        // Strategy 3: Final overflow check with tooltip fallback
                        setTimeout(() => {
                            if (h3.scrollWidth > h3.clientWidth * 1.2) {
                                // Extreme case - add tooltip and ensure no layout break
                                h3.title = `${text} (Full text - click to expand)`;
                                h3.style.cursor = 'help';
                                
                                // Ensure it fits by any means necessary
                                h3.style.fontSize = 'clamp(0.8rem, 1.8vw, 1.1rem)';
                                h3.style.letterSpacing = '0.1px';
                                h3.style.wordSpacing = '0.02em';
                                
                                // Click handler to show full text in a subtle way
                                h3.addEventListener('click', function(e) {
                                    const originalHTML = this.innerHTML;
                                    const originalClasses = [...this.classList];
                                    
                                    // Temporarily show full text with adjusted styling
                                    this.style.fontSize = 'clamp(0.7rem, 1.6vw, 0.95rem)';
                                    this.style.lineHeight = '1';
                                    this.style.webkitLineClamp = '4';
                                    this.style.maxHeight = 'calc(1em * 4 + 0.2em)';
                                    
                                    // Reset after 3 seconds
                                    setTimeout(() => {
                                        this.innerHTML = originalHTML;
                                        this.className = '';
                                        originalClasses.forEach(cls => this.classList.add(cls));
                                        this.style.fontSize = '';
                                        this.style.lineHeight = '';
                                        this.style.webkitLineClamp = '3';
                                        this.style.maxHeight = 'calc(1.1em * 3 + 0.2em)';
                                    }, 3000);
                                });
                            }
                        }, 50);
                    }, 50);
                });
            }, 250);
        }

        function setFilter(filter) {
            currentFilter = filter;
            displayDashboard();
        }

        document.addEventListener('DOMContentLoaded', function () {
            usernameInputElement = document.getElementById('usernameInput');
            contentElement = document.getElementById('content');
            randomFooterMessageElement = document.getElementById('randomFooterMessage');
            loadUserDataButtonElement = document.getElementById('loadUserDataBtn');

            if (usernameInputElement) {
                usernameInputElement.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') {
                        loadUserData();
                    }
                });
            }

            if (loadUserDataButtonElement) {
                loadUserDataButtonElement.addEventListener('click', loadUserData);
            }

            if (randomFooterMessageElement) {
                setRandomFooterMessage();
            }
        });
    </script>
</body>

</html>
